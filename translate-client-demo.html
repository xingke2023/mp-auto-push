<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译 API 测试客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .config-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        .result-box {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
        }

        .result-label {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .result-text {
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #28a745;
        }

        .info-box {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .batch-result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .batch-result-table th,
        .batch-result-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .batch-result-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
        }

        .batch-result-table tr:last-child td {
            border-bottom: none;
        }

        .status-success {
            color: #28a745;
            font-weight: 600;
        }

        .status-failed {
            color: #dc3545;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 翻译 API 测试客户端</h1>
            <p>基于 Google 翻译的远程翻译服务</p>
        </div>

        <div class="content">
            <!-- 配置区域 -->
            <div class="config-section">
                <h2>⚙️ API 配置</h2>
                <div class="info-box">
                    <strong>提示：</strong> 请填写您的服务器地址和 API Key。如果不知道如何获取，请联系管理员。
                </div>
                <div class="form-group">
                    <label for="apiUrl">API 服务器地址</label>
                    <input type="text" id="apiUrl" placeholder="http://your-server-ip:5003" value="http://localhost:5003">
                </div>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="请输入您的 API Key">
                </div>
            </div>

            <!-- 单文本翻译 -->
            <div class="config-section">
                <h2>📝 单文本翻译</h2>
                <div class="form-group">
                    <label for="singleText">要翻译的文本</label>
                    <textarea id="singleText" placeholder="请输入要翻译的文本...">Hello, world! How are you today?</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="singleFrom">源语言</label>
                        <select id="singleFrom">
                            <option value="auto">自动检测</option>
                            <option value="en">英语</option>
                            <option value="zh-cn">中文（简体）</option>
                            <option value="zh-tw">中文（繁体）</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                            <option value="fr">法语</option>
                            <option value="de">德语</option>
                            <option value="es">西班牙语</option>
                            <option value="ru">俄语</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="singleTo">目标语言</label>
                        <select id="singleTo">
                            <option value="zh-cn">中文（简体）</option>
                            <option value="en">英语</option>
                            <option value="zh-tw">中文（繁体）</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                            <option value="fr">法语</option>
                            <option value="de">德语</option>
                            <option value="es">西班牙语</option>
                            <option value="ru">俄语</option>
                        </select>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="translateSingle()">翻译</button>
                </div>
                <div id="singleResult"></div>
            </div>

            <!-- 批量翻译 -->
            <div class="config-section">
                <h2>📚 批量翻译</h2>
                <div class="form-group">
                    <label for="batchText">要翻译的文本（每行一个）</label>
                    <textarea id="batchText" placeholder="请输入要翻译的文本，每行一个...">Good morning
Good afternoon
Good evening
Thank you
Goodbye</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="batchFrom">源语言</label>
                        <select id="batchFrom">
                            <option value="auto">自动检测</option>
                            <option value="en">英语</option>
                            <option value="zh-cn">中文（简体）</option>
                            <option value="zh-tw">中文（繁体）</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="batchTo">目标语言</label>
                        <select id="batchTo">
                            <option value="zh-cn">中文（简体）</option>
                            <option value="en">英语</option>
                            <option value="zh-tw">中文（繁体）</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                        </select>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="translateBatch()">批量翻译</button>
                </div>
                <div id="batchResult"></div>
            </div>

            <!-- 加载指示器 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>正在翻译中，请稍候...</p>
            </div>
        </div>
    </div>

    <script>
        // 获取API配置
        function getApiConfig() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!apiUrl) {
                showError('请输入 API 服务器地址');
                return null;
            }

            if (!apiKey) {
                showError('请输入 API Key');
                return null;
            }

            return { apiUrl, apiKey };
        }

        // 单文本翻译
        async function translateSingle() {
            const config = getApiConfig();
            if (!config) return;

            const text = document.getElementById('singleText').value.trim();
            const from = document.getElementById('singleFrom').value;
            const to = document.getElementById('singleTo').value;

            if (!text) {
                showError('请输入要翻译的文本');
                return;
            }

            const resultDiv = document.getElementById('singleResult');
            const loadingDiv = document.getElementById('loading');

            resultDiv.innerHTML = '';
            loadingDiv.classList.add('show');

            try {
                const response = await fetch(`${config.apiUrl}/api/translate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': config.apiKey
                    },
                    body: JSON.stringify({ text, from, to })
                });

                const result = await response.json();

                loadingDiv.classList.remove('show');

                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="result-section">
                            <h3>✅ 翻译成功</h3>
                            <div class="result-box">
                                <div class="result-label">原文 (${result.data.detectedLanguage})</div>
                                <div class="result-text">${escapeHtml(result.data.originalText)}</div>
                            </div>
                            <div class="result-box">
                                <div class="result-label">译文 (${result.data.targetLanguage})</div>
                                <div class="result-text">${escapeHtml(result.data.translatedText)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    showError(`翻译失败: ${result.message || result.error}`);
                }
            } catch (error) {
                loadingDiv.classList.remove('show');
                showError(`请求失败: ${error.message}`);
            }
        }

        // 批量翻译
        async function translateBatch() {
            const config = getApiConfig();
            if (!config) return;

            const textInput = document.getElementById('batchText').value.trim();
            const from = document.getElementById('batchFrom').value;
            const to = document.getElementById('batchTo').value;

            if (!textInput) {
                showError('请输入要翻译的文本');
                return;
            }

            const texts = textInput.split('\n').map(t => t.trim()).filter(t => t.length > 0);

            if (texts.length === 0) {
                showError('请输入至少一行要翻译的文本');
                return;
            }

            const resultDiv = document.getElementById('batchResult');
            const loadingDiv = document.getElementById('loading');

            resultDiv.innerHTML = '';
            loadingDiv.classList.add('show');

            try {
                const response = await fetch(`${config.apiUrl}/api/translate/batch`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': config.apiKey
                    },
                    body: JSON.stringify({ texts, from, to })
                });

                const result = await response.json();

                loadingDiv.classList.remove('show');

                if (result.success) {
                    let tableHtml = `
                        <div class="result-section">
                            <h3>✅ 批量翻译完成</h3>
                            <div class="success">
                                总计: ${result.data.totalCount} 条 |
                                成功: ${result.data.successCount} 条 |
                                失败: ${result.data.failedCount} 条
                            </div>
                            <table class="batch-result-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>原文</th>
                                        <th>译文</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    result.data.results.forEach((item, index) => {
                        const status = item.success
                            ? `<span class="status-success">✓ 成功</span>`
                            : `<span class="status-failed">✗ 失败</span>`;
                        const translated = item.success
                            ? escapeHtml(item.translated)
                            : `<span style="color: #dc3545;">${escapeHtml(item.error)}</span>`;

                        tableHtml += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${escapeHtml(item.original)}</td>
                                <td>${translated}</td>
                                <td>${status}</td>
                            </tr>
                        `;
                    });

                    tableHtml += `
                                </tbody>
                            </table>
                        </div>
                    `;

                    resultDiv.innerHTML = tableHtml;
                } else {
                    showError(`批量翻译失败: ${result.message || result.error}`);
                }
            } catch (error) {
                loadingDiv.classList.remove('show');
                showError(`请求失败: ${error.message}`);
            }
        }

        // 显示错误信息
        function showError(message) {
            const resultDivs = document.querySelectorAll('[id$="Result"]');
            resultDivs.forEach(div => {
                div.innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
            });
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载时从 localStorage 恢复配置
        window.addEventListener('DOMContentLoaded', () => {
            const savedApiUrl = localStorage.getItem('apiUrl');
            const savedApiKey = localStorage.getItem('apiKey');

            if (savedApiUrl) {
                document.getElementById('apiUrl').value = savedApiUrl;
            }
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
        });

        // 保存配置到 localStorage
        document.getElementById('apiUrl').addEventListener('change', (e) => {
            localStorage.setItem('apiUrl', e.target.value);
        });

        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('apiKey', e.target.value);
        });
    </script>
</body>
</html>
